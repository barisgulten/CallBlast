; ============================================================================
; CallBlast Dialplan
; ============================================================================

[general]
static = yes
writeprotect = no

; ---------------------------------------------------------------------------
; Context: from-cucm
; Handles incoming calls from Cisco Call Manager
; Any incoming call dialed through the trunk (e.g. 5555, 9999) is routed
; to the ARI Stasis application "callblast" to trigger the mass notification.
; ---------------------------------------------------------------------------
[from-cucm]
; Match any dialed extension from CUCM and route to CallBlast Stasis app
; Send 180 Ringing first so CUCM properly cuts through audio on the calling phone
; Enforce hardware-level absolute timeout so the trigger caller line always hangs up after the chime
exten => _X.,1,NoOp(CallBlast trigger call received from CUCM to extension ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=3)
 same => n,Ringing()
 same => n,Wait(0.2)
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,Stasis(callblast)
 same => n,Hangup(16)

exten => s,1,NoOp(CallBlast trigger call received with s-extension)
 same => n,Set(TIMEOUT(absolute)=3)
 same => n,Ringing()
 same => n,Wait(0.2)
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,Stasis(callblast)
 same => n,Hangup(16)

exten => T,1,NoOp(CallBlast trigger call auto-hangup on absolute timeout)
 same => n,Hangup(16)

exten => h,1,NoOp(CallBlast trigger call hung up)

; ---------------------------------------------------------------------------
; Context: callblast-outbound
; Used for originating outbound blast calls back through the CUCM trunk.
; Each outbound call is also managed by the ARI Stasis application.
; ---------------------------------------------------------------------------
[callblast-outbound]
exten => _X.,1,NoOp(CallBlast outbound call to ${EXTEN})
 same => n,Stasis(callblast-outbound,${EXTEN})
 same => n,Hangup()
