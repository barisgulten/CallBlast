[general]
; RTP port range - keep small for controlled environments
; Supports up to ~50 simultaneous calls
rtpstart = 10000
rtpend = 10050

; Enable RTP checksums
rtpchecksums = yes

; DTMF timeout
dtmftimeout = 3000

; Strict RTP protection - disabled for immediate audio playback to silent callers
strictrtp = no
