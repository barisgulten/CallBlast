[general]
; Enable the built-in HTTP server for ARI
enabled = yes

; Bind to all interfaces (required for Docker container access)
bindaddr = 0.0.0.0

; HTTP port for ARI REST API
bindport = 8088

; Enable TLS in production - disabled for development
; tlsenable = no
; tlsbindaddr = 0.0.0.0:8089
; tlscertfile = /etc/asterisk/keys/asterisk.pem
; tlsprivatekey = /etc/asterisk/keys/asterisk.key
